<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   花のは — HANANO-WA
   A hand-coded voxel garden: five-storied pagoda, torii gate,
   koi pond, arched bridge, bamboo grove, rock garden, maples,
   pines, willows and — above all — cherry blossoms that fall.
   ============================================================ */

/* ---------------- deterministic randomness ---------------- */
function hash3(x, y, z, seed) {
  let n = (x * 374761393) ^ (y * 668265263) ^ (z * 1274126177) ^ (seed * 982451653);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n = (n ^ (n >>> 16)) >>> 0;
  return n / 4294967295;
}
function hash2(x, z, seed) { return hash3(x, 7, z, seed); }
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(20261120);
const pick = arr => arr[(rnd() * arr.length) | 0];
const rr = (a, b) => a + rnd() * (b - a);

/* ---------------- palette ---------------- */
const P = {
  // ground
  grassA: 0x69994e, grassB: 0x5c8a49, grassC: 0x77a35b, grassD: 0x4f7a41,
  dirt: 0x6b4f3a, dirtD: 0x59412f,
  sand: 0xd9cb9f, sandB: 0xc7b283,
  stone: 0x9aa0a3, stoneB: 0x84898c, stoneTop: 0xb3b8ba, stoneDark: 0x6f7477,
  buff: 0xc2b08a, buffB: 0xad9a76, gravel: 0xbdb39a,
  // pagoda
  vermilion: 0xc53b2e, vermD: 0xa52f27, wood: 0x4a2e1c, woodL: 0x63412a,
  tile: 0x36404e, tileD: 0x2a323e, tileL: 0x445060,
  shoji: 0xf3e7c8, shojiB: 0xe6d7b2,
  gold: 0xe7b64c, goldD: 0xc7963a,
  cream: 0xe9dcc0,
  // flora
  pinkA: 0xffc3d0, pinkB: 0xffa8bd, pinkC: 0xf7d2dd, pinkD: 0xf291a9, pinkE: 0xffe1e8,
  mapleA: 0xe05a12, mapleB: 0xd43b1f, mapleC: 0xf29b1d, mapleD: 0xc2292b,
  pineA: 0x2f6b4d, pineB: 0x235440, pineC: 0x3d7a57,
  willowA: 0x6db35f, willowB: 0x55924a,
  bamboo: 0x7fb069, bambooN: 0x59803f, bambooL: 0x93c47d,
  leafA: 0x55924a, leafB: 0x67a856, leafC: 0x47803e,
  trunk: 0x6a4a30, trunkD: 0x543a26,
  moss: 0x6f8f4f,
  // water & extras
  water: 0x3e86b8, waterDeep: 0x2f6a94,
  rock: 0x7d8286, rockB: 0x666b6f,
  white: 0xf2efe6,
  tulipR: 0xd63748, tulipY: 0xefb929, tulipP: 0x9b59b6, tulipW: 0xf5f0e6, tulipO: 0xe67e22,
  glow: 0xffca70, glowW: 0xffe1a0,
};
const GRASS = [P.grassA, P.grassA, P.grassB, P.grassC, P.grassD];
const PINKS = [P.pinkA, P.pinkA, P.pinkB, P.pinkB, P.pinkC, P.pinkD, P.pinkE];
const MAPLES = [P.mapleA, P.mapleA, P.mapleB, P.mapleC, P.mapleD];

/* ---------------- voxel stores ---------------- */
const world = new Map();     // opaque voxels  key -> color
const waterV = new Map();    // translucent voxels
const glowV = new Map();     // emissive voxels
const K = (x, y, z) => x + ',' + y + ',' + z;

function setV(x, y, z, c) { world.set(K(x, y, z), c); }
function setW(x, y, z, c) { waterV.set(K(x, y, z), c ?? P.water); }
function setG(x, y, z, c) { glowV.set(K(x, y, z), c ?? P.glow); }
function fill(x1, y1, z1, x2, y2, z2, c) {
  for (let x = x1; x <= x2; x++) for (let y = y1; y <= y2; y++) for (let z = z1; z <= z2; z++) setV(x, y, z, c);
}
function ring(cx, cz, h, y, c, skip) {
  for (let x = -h; x <= h; x++) for (let z = -h; z <= h; z++) {
    if (Math.max(Math.abs(x), Math.abs(z)) !== h) continue;
    if (skip && skip(cx + x, cz + z)) continue;
    setV(cx + x, y, cz + z, c);
  }
}

/* ---------------- geography ---------------- */
const BOUND = 55;
const pond = { x: 34, z: 4, r: 13 };
const streamPts = [[20, 6], [8, 12], [-6, 20], [-18, 26], [-30, 30]];
const pathX = 3, pathZ1 = 15, pathZ2 = 55;

function distToStream(x, z) {
  let m = 1e9;
  for (let i = 0; i < streamPts.length - 1; i++) {
    const [ax, az] = streamPts[i], [bx, bz] = streamPts[i + 1];
    const dx = bx - ax, dz = bz - az;
    const t = Math.max(0, Math.min(1, ((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz)));
    m = Math.min(m, Math.hypot(x - (ax + dx * t), z - (az + dz * t)));
  }
  return m;
}
function inPond(x, z) { return Math.hypot(x - pond.x, z - pond.z) < pond.r; }
function inPath(x, z) { return Math.abs(x) <= pathX && z >= pathZ1 - 1 && z <= pathZ2; }
function inRockGarden(x, z) { return x >= -52 && x <= -28 && z >= -16 && z <= 0; }
function hillH(x, z) {  // small hill NW for pines & cherry
  const d = Math.hypot(x + 30, z + 28);
  return d < 15 ? Math.max(0, Math.round((1 - d / 15) * 3)) : 0;
}

/* ---------------- terrain ---------------- */
function buildTerrain() {
  for (let x = -BOUND; x <= BOUND; x++) {
    for (let z = -BOUND; z <= BOUND; z++) {
      if (inRockGarden(x, z)) continue;               // handled separately
      const hh = hillH(x, z);
      if (inPond(x, z) || distToStream(x, z) < 2.6) { // dig basins
        setV(x, -1, z, P.dirtD); setV(x, -2, z, P.stoneDark);
        if (inPond(x, z)) { setW(x, 0, z, Math.hypot(x - pond.x, z - pond.z) > pond.r - 4 ? P.water : P.waterDeep); }
        else { setW(x, 0, z, P.water); }
        continue;
      }
      // banks: sandy where water is near
      const nearWater = inPond(x, z + 1) || inPond(x, z - 1) || inPond(x + 1, z) || inPond(x - 1, z) ||
                        distToStream(x, z) < 4.2;
      if (nearWater) setV(x, 0, z, hash2(x, z, 5) < .5 ? P.sand : P.sandB);
      else if (inPath(x, z)) {
        const hsh = hash2(x, z, 11);
        setV(x, 0, z, hsh < .4 ? P.stoneTop : hsh < .75 ? P.stone : P.buff);
      }
      else setV(x, 0, z, GRASS[(hash2(x, z, 3) * GRASS.length) | 0]);

      setV(x, -1, z, hash2(x, z, 9) < .3 ? P.dirtD : P.dirt);

      // hill fill
      for (let y = 1; y <= hh; y++)
        setV(x, y, z, y === hh ? GRASS[(hash2(x, z + y, 4) * GRASS.length) | 0] : P.dirt);

      // grass tufts + wildflowers speckle
      const t = hash2(x, z, 17);
      if (!nearWater && !inPath(x, z) && t > .985) setV(x, 1, z, P.grassC);
      if (!nearWater && !inPath(x, z) && t < .006) {
        setV(x, 1, z, P.leafC);
        setV(x, 2, z, pick([P.tulipR, P.tulipY, P.tulipW, P.tulipP]));
      }
    }
  }
  // pond island
  for (let x = pond.x - 3; x <= pond.x + 3; x++)
    for (let z = pond.z - 3; z <= pond.z + 3; z++) {
      if (Math.hypot(x - pond.x + 1, z - pond.z - 2) > 3.4) continue;
      if (!inPond(x, z)) continue;
      waterV.delete(K(x, y0, z));
      setV(x, 0, z, P.sand); setV(x, 1, z, P.sandB);
    }
}
const y0 = 0;

/* ---------------- rock garden (karesansui) ---------------- */
function buildRockGarden() {
  const rocks = [[-46, -10], [-38, -3], [-32, -12], [-44, 3]];
  for (let x = -52; x <= -28; x++) for (let z = -16; z <= 0; z++) {
    let d = 1e9;
    for (const [rx, rz] of rocks) d = Math.min(d, Math.hypot(x - rx, z - rz));
    const band = Math.sin(d * 1.9 + hash2(x, z, 2) * .5);
    setV(x, 0, z, band > 0 ? P.white : P.sandB);
    setV(x, -1, z, P.sand);
  }
  for (const [rx, rz] of rocks) {
    const h = 2 + ((hash2(rx, rz, 6) * 2) | 0);
    for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
      const hgt = h - Math.abs(dx) - Math.abs(dz) + 1;
      for (let y = 1; y <= Math.max(1, hgt); y++)
        setV(rx + dx, y, rz + dz, hash3(rx + dx, y, rz + dz, 8) < .3 ? P.rockB : P.rock);
    }
    setV(rx, h + 1, rz, P.moss);       // moss cap
    if (hash2(rx, rz, 13) < .6) setV(rx + 2, 1, rz, P.moss);
  }
  // clipped shrubs
  for (const [sx, sz] of [[-50, -6], [-30, -8], [-34, 4]]) {
    for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) for (let dy = 0; dy <= (Math.abs(dx) + Math.abs(dz) === 2 ? 0 : 1); dy++)
      setV(sx + dx, 1 + dy, sz + dz, hash3(sx + dx, dy, sz + dz, 19) < .4 ? P.pineB : P.pineA);
  }
}

/* ---------------- pagoda ---------------- */
function story(cx, cz, y0, y1, half) {
  for (let y = y0; y <= y1; y++) {
    for (let x = -half; x <= half; x++) for (let z = -half; z <= half; z++) {
      const m = Math.max(Math.abs(x), Math.abs(z));
      if (m !== half) continue;
      const corner = Math.abs(x) === half && Math.abs(z) === half;
      const post = corner || ((Math.abs(x) === half ? Math.abs(z) : Math.abs(x)) === 0);
      let c = post ? P.wood : (hash3(x, y, z, 21) < .25 ? P.vermD : P.vermilion);
      // shoji panels mid-wall
      if (!post && y >= y0 + 2 && y <= y0 + 3 && hash3(x, y, z, 23) < .55) c = P.shoji;
      setV(cx + x, y, cz + z, c);
    }
  }
  // glowing windows, one per face (remove the wall block so the glow shows)
  const wy = y1 - 1;
  for (const [wx, wz] of [[cx, cz + half], [cx, cz - half], [cx + half, cz], [cx - half, cz]]) {
    world.delete(K(wx, wy, wz));
    setG(wx, wy, wz, P.glowW);
  }
}

function roof(cx, cz, yBase, halfMax, halfMin) {
  let h = halfMax, y = yBase;
  while (h >= halfMin) {
    for (let x = -h; x <= h; x++) for (let z = -h; z <= h; z++) {
      if (Math.max(Math.abs(x), Math.abs(z)) !== h) continue;
      const hv = hash3(cx + x, y, cz + z, 31);
      setV(cx + x, y, cz + z, hv < .12 ? P.tileD : hv > .88 ? P.tileL : P.tile);
    }
    if (h > halfMax - 2) {  // upturned eave corners
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
        setV(cx + sx * h, y + 1, cz + sz * h, P.tile);
        if (h === halfMax) {
          setV(cx + sx * h, y + 2, cz + sz * h, P.gold);      // golden horn
          setV(cx + sx * (h - 1), y - 1, cz + sz * (h - 1), P.cream); // bracket
        }
      }
    }
    h--; y++;
  }
  for (let z = -halfMin; z <= halfMin; z++) setV(cx, y, cz + z, P.tileD); // ridge
  for (const sz of [-1, 1]) { setV(cx, y + 1, cz + sz * halfMin, P.gold);  // ridge caps
    if (halfMin > 1) setV(cx, y, cz + sz * (halfMin + 1), P.tileD); }
}

function buildPagoda() {
  // stone platform
  for (let x = -14; x <= 14; x++) for (let z = -14; z <= 14; z++) {
    const edge = Math.max(Math.abs(x), Math.abs(z));
    setV(x, 1, z, edge === 14 ? P.stoneDark : (hash2(x, z, 41) < .15 ? P.stoneB : P.stone));
    setV(x, 2, z, edge === 14 ? P.stone : P.stoneTop);
  }
  fill(-3, 1, 15, 3, 1, 15, P.stone);   // stair
  fill(-4, 1, 15, -4, 2, 15, P.stoneDark); fill(4, 1, 15, 4, 2, 15, P.stoneDark);
  // balustrade
  for (let x = -14; x <= 14; x++) for (let z = -14; z <= 14; z++) {
    if (Math.max(Math.abs(x), Math.abs(z)) !== 14) continue;
    if (z === 14 && Math.abs(x) <= 3) continue;
    setV(x, 3, z, hash2(x, z, 43) < .5 ? P.vermilion : P.woodL);
  }
  for (const [x, z] of [[-14, -14], [14, -14], [-14, 14], [14, 14]])
    { setV(x, 4, z, P.gold); }

  // ground floor with great door
  story(0, 0, 3, 9, 7);
  fill(-1, 3, 7, 1, 6, 7, P.wood);
  setV(0, 3, 7, P.gold); setV(0, 4, 7, P.gold);           // door fittings
  setG(-3, 3, 8, P.glow); setG(3, 3, 8, P.glow);          // door lanterns
  setV(-3, 4, 8, P.wood); setV(3, 4, 8, P.wood);
  setV(-3, 5, 8, P.wood); setV(3, 5, 8, P.wood);

  roof(0, 0, 10, 12, 5);
  story(0, 0, 18, 23, 5);
  roof(0, 0, 24, 10, 4);
  story(0, 0, 31, 35, 4);
  roof(0, 0, 36, 9, 4);
  story(0, 0, 42, 46, 3);
  roof(0, 0, 47, 8, 3);
  story(0, 0, 53, 56, 2);
  roof(0, 0, 57, 6, 1);
  // finial (sōrin)
  fill(0, 64, 0, 0, 71, 0, P.gold);
  for (const ry of [65, 67, 69]) for (let x = -1; x <= 1; x++) for (let z = -1; z <= 1; z++)
    if (Math.max(Math.abs(x), Math.abs(z)) === 1) setV(x, ry, z, P.goldD);
  setV(0, 72, 0, P.gold); setV(0, 73, 0, P.goldD);        // flame jewel
}

/* ---------------- torii ---------------- */
function buildTorii(cx, cz) {
  fill(cx - 5, 1, cz - 1, cx - 4, 10, cz, P.vermilion);
  fill(cx + 4, 1, cz - 1, cx + 5, 10, cz, P.vermilion);
  fill(cx - 5, 1, cz - 1, cx - 5, 2, cz - 1, P.stone);  // stone bases
  fill(cx + 5, 1, cz - 1, cx + 5, 2, cz - 1, P.stone);
  for (let x = cx - 6; x <= cx + 6; x++) setV(x, 10, cz, P.vermilion);       // nuki
  fill(cx - 1, 11, cz, cx + 1, 12, cz, P.wood);                              // plaque
  setV(cx, 11, cz - 1, P.gold); setV(cx, 12, cz - 1, P.gold);                // crest
  for (let x = cx - 7; x <= cx + 7; x++) {                                   // shimaki
    setV(x, 13, cz, P.tileD);
    setV(x, 14, cz, x === cx - 7 || x === cx + 7 ? P.gold : P.tile);
  }
  setV(cx - 8, 15, cz, P.gold); setV(cx + 8, 15, cz, P.gold);                // swept tips
}

/* ---------------- stone lanterns ---------------- */
const lanternSpots = [[5, 38], [-5, 38], [5, 26], [-5, 26], [12, 16], [-12, 16],
  [-13, 23], [20, 15], [-40, 5], [-30, 18]];
function buildLantern(x, z, yBase = 0) {
  fill(x - 1, yBase + 1, z - 1, x, yBase + 2, z, P.stoneB);
  setV(x, yBase + 3, z, P.stone); setV(x, yBase + 4, z, P.stoneB);
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++)
    for (let y = yBase + 5; y <= yBase + 6; y++) {
      if (dx === 0 && dz === 0) { if (y === yBase + 5) setG(x, y, z, P.glow); continue; }
      if (y === yBase + 5 && (dx === 0 || dz === 0)) continue;   // window openings around the glass
      if (dx !== 0 && dz !== 0 && hash3(x + dx, y, z + dz, 47) < .5) continue; // openwork corners
      setV(x + dx, y, z + dz, P.stone);
    }
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) setV(x + dx, yBase + 7, z + dz, P.stoneDark);
  setV(x, yBase + 8, z, P.stoneB);
}

/* ---------------- trees ---------------- */
const cherrySpots = [];
function trunk(x, z, h, r = 0) {
  for (let y = 0; y <= h; y++) {
    for (let dx = -r; dx <= r; dx++) for (let dz = -r; dz <= r; dz++) {
      if (r && y > h - 3 && Math.abs(dx) + Math.abs(dz) > r) continue;
      setV(x + dx, y + (inPond(x, z) ? 0 : hillH(x, z)), z + dz,
        y === 0 && hash2(x + dx, z + dz, 51) < .4 ? P.trunkD : P.trunk);
    }
  }
}
function blob(cx, cy, cz, r, pal, holeP = .18) {
  const ri = Math.ceil(r);
  for (let dx = -ri; dx <= ri; dx++) for (let dy = -ri; dy <= ri; dy++) for (let dz = -ri; dz <= ri; dz++) {
    const d = Math.hypot(dx, dy * 1.15, dz);
    if (d > r) continue;
    if (d > r - 1.1 && hash3(cx + dx, cy + dy, cz + dz, 53) < holeP) continue;
    setV(cx + dx, cy + dy, cz + dz, pal[(hash3(cx + dx, cy + dy, cz + dz, 57) * pal.length) | 0]);
  }
}
function cherryTree(x, z) {
  cherrySpots.push([x, z]);
  const h = 7 + ((rnd() * 3) | 0);
  trunk(x, z, h);
  // leaning branch arms
  for (let i = 1; i <= 3; i++) {

  c.r = Math.min(1, Math.max(0, c.r + j)); c.g = Math.min(1, Math.max(0, c.g + j)); c.b = Math.min(1, Math.max(0, c.b + j));
  return c;
}
function bakeMap(map, geo, mat, { jitterAmt = 0, shadows = true } = {}) {

  keys.forEach((k, i) => {
    const [x, y, z] = k.split(',').map(Number);

}

      b.rotation.y = -u.a + (u.sp > 0 ? Math.PI : 0);
      const flap = Math.sin(t * 9 + u.ph) * .9;
      u.p1.rotation.z = -flap; u.p2.rotation.z = flap;
    }

    controls.update();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // UI
  document.querySelectorAll('#panel button[data-mode]').forEach(b =>
    b.addEventListener('click', () => { autoCycle = false; document.getElementById('cycle').classList.remove('on'); setMode(b.dataset.mode); }));
  document.getElementById('cycle').addEventListener('click', e => { autoCycle = !autoCycle; cycleT = 0; e.currentTarget.classList.toggle('on', autoCycle); });
  document.getElementById('orbit').addEventListener('click', e => {
    controls.autoRotate = !controls.autoRotate; controls.autoRotateSpeed = .6;
    e.currentTarget.classList.toggle('on', controls.autoRotate);
  });

  animate();
  requestAnimationFrame(() => document.getElementById('loader').classList.add('gone'));
}

/* headless verification hook */
if (headless) {
  globalThis.__voxelReport = {
    opaque: world.size, water: waterV.size, glow: glowV.size,
    lanterns: lanternSpots.length, cherries: cherrySpots.length,
  };
}
</script>
